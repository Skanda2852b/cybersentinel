version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cybersentinel
      POSTGRES_PASSWORD: cybersentinel
      POSTGRES_DB: cybersentinel_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersentinel -d cybersentinel_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ci-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: "postgresql://cybersentinel:cybersentinel@postgres:5432/cybersentinel_test"
      API_PORT: 3000
      NODE_ENV: "test"
      JWT_SECRET: "test-secret-key-min-32-characters-long-for-ci-testing"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: "test-refresh-secret-key-min-32-characters-long-for-ci-testing"
      JWT_REFRESH_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:5173"
      INGESTION_API_KEY: "ci-test-ingestion-key"
      ML_SERVICE_URL: "http://ml-service:8000"
      ML_SERVICE_TIMEOUT_MS: "5000"
      LOG_LEVEL: "error"
      BCRYPT_ROUNDS: "4"
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "lax"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ci-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
      target: production
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MODEL_PATH: "/app/models/isolation_forest.joblib"
      LOG_LEVEL: "ERROR"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ci-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      VITE_API_URL: "http://localhost:3000/api/v1"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ci-network

networks:
  ci-network:
    driver: bridge
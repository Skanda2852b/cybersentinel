server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cybersentinel-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: cybersentinel-backend
          service: backend
          __path__: /var/log/backend/*.log

  - job_name: cybersentinel-ml-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: cybersentinel-ml-service
          service: ml-service
          __path__: /var/log/ml-service/*.log

  - job_name: cybersentinel-frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: cybersentinel-frontend
          service: frontend
          __path__: /var/log/frontend/*.log

  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            container: container_name
            log: log
      - labels:
          container:
      - output:
          source: log